<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fake Job Detector{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('home') }}">Fake Job Detector</a>
      <nav>
        {% if current_email %}
          <a href="{{ url_for('home') }}">Analyze</a>
          <a href="{{ url_for('dashboard') }}">Dashboard</a>
          <a href="{{ url_for('about') }}">How it works</a>
          <form class="inline-form" method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="link-button" type="submit">Log out</button>
          </form>
        {% else %}
          <a href="{{ url_for('about') }}">How it works</a>
          <a href="{{ url_for('login') }}">Log in</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Results are risk indicators based on detected signals. They are not proof that a job is real or fake.</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
