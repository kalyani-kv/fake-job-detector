{% extends "base.html" %}

{% block title %}Log in - Fake Job Detector{% endblock %}

{% block content %}
<section class="hero">
  <h1>Log in</h1>
  <p>Sign in to analyze job postings.</p>
</section>

<form class="card auth-card" method="post" action="{{ url_for('login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="email">Email</label>
  <input id="email" name="email" type="email" required maxlength="254"
         autocomplete="username" value="{{ form.get('email', '') }}">

  <label for="password">Password</label>
  <input id="password" name="password" type="password" required maxlength="128"
         autocomplete="current-password">

  <span class="error">{{ error }}</span>
  <button class="button" type="submit">Log in</button>
  <p class="muted small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</form>
{% endblock %}
